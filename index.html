<script type="module">
  let allQuestions = [];
  let currentUtterance = null;
  let activeSpeakBtn = null;

  // Web Audio Context initialization
  let audioCtx;

  function getAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
  }

  function playCorrectSound() {
    const ctx = getAudioContext();
    const now = ctx.currentTime;
    const chord = [523.25, 659.25, 783.99, 1046.50]; // C E G C
    
    chord.forEach(freq => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 0.95);
    });
  }

  function playIncorrectSound() {
    const ctx = getAudioContext();
    const now = ctx.currentTime;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(130.81, now);
    osc.frequency.exponentialRampToValueAtTime(98.00, now + 0.2);

    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(now);
    osc.stop(now + 0.25);
  }

  function triggerPopper() {
    if (typeof confetti === 'function') {
      confetti({
        particleCount: 90,
        spread: 80,
        origin: { y: 0.6 }
      });
    }
  }

  function triggerBalloons() {
    const balloonContainer = document.getElementById('balloon-container');
    const colors = ['#ff4d4d', '#3399ff', '#33cc33', '#ffcc00', '#cc33ff', '#ff9933'];

    for (let i = 0; i < 8; i++) {
      const balloon = document.createElement('div');
      balloon.className = 'balloon';
      
      const randomColor = colors[Math.floor(Math.random() * colors.length)];
      const randomLeft = Math.random() * 80 + 10;
      const randomDelay = Math.random() * 0.5;

      balloon.style.backgroundColor = randomColor;
      balloon.style.left = randomLeft + '%';
      balloon.style.animationDelay = randomDelay + 's';

      balloonContainer.appendChild(balloon);

      setTimeout(() => {
        balloon.remove();
      }, 4000);
    }
  }

  function getBestVoice() {
    const voices = window.speechSynthesis.getVoices();
    return voices.find(v => 
      v.lang.startsWith('en') && (
        v.name.includes('Natural') || 
        v.name.includes('Google') || 
        v.name.includes('Enhanced') ||
        v.name.includes('Premium')
      )
    ) || voices.find(v => v.lang.startsWith('en')) || voices[0];
  }

  const cleanText = (str) => {
    if (!str) return '';
    return str
        .replace(/\*\*(.*?)\*\*/g, '$1')  // Remove bold markers
        .replace(/\*(.*?)\*/g, '$1')       // Remove italic markers
        .replace(/### (.*$)/g, '$1')       // Remove header markers
        .replace(/## (.*$)/g, '$1')
        .replace(/# (.*$)/g, '$1')
        .replace(/\\[a-zA-Z]+/g, '')       // Remove LaTeX commands
        .replace(/[{}]/g, '')              // Remove curly braces
        .replace(/\^/g, ' to the power of ') // Convert superscript
        .replace(/_/g, ' sub ')            // Convert subscript
        .replace(/<[^>]*>/g, '')           // Remove HTML tags
        .replace(/\s+/g, ' ')              // Normalize spaces
        .trim();
  };

  /* UPDATED SPEECH ENGINE WITH WORD HIGHLIGHTING */
 /* ROBUST WORD HIGHLIGHTER WITH TIMER FALLBACK */
/* ENHANCED SPAN & LINE WRAPPER ENGINE */
function wrapTextNodesInSpans(element) {
  // Store the original HTML
  const html = element.innerHTML;
  
  // Create a temporary container
  const temp = document.createElement('div');
  temp.innerHTML = html;
  
  // Walk through text nodes only (skip HTML tags)
  const walker = document.createTreeWalker(temp, NodeFilter.SHOW_TEXT, null, false);
  const textNodes = [];
  let node;
  while ((node = walker.nextNode())) {
    if (node.nodeValue.trim().length > 0) {
      textNodes.push(node);
    }
  }
  
  let totalWords = 0;
  
  // Wrap each text node's words
  textNodes.forEach(textNode => {
    const words = textNode.nodeValue.split(/(\s+)/);
    const fragment = document.createDocumentFragment();
    
    words.forEach(word => {
      if (word.trim().length > 0) {
        const span = document.createElement('span');
        span.className = 'speech-word';
        span.dataset.wordIndex = totalWords++;
        span.textContent = word;
        fragment.appendChild(span);
      } else {
        fragment.appendChild(document.createTextNode(word));
      }
    });
    
    textNode.parentNode.replaceChild(fragment, textNode);
  });
  
  // Update the element with wrapped content
  element.innerHTML = temp.innerHTML;
  return totalWords;
}

function speakText(text, btn, labelText, containerEl) {
  if (!('speechSynthesis' in window)) {
    alert("Sorry, your browser does not support Speech Synthesis.");
    return;
  }

  if (window.speechSynthesis.speaking) {
    window.speechSynthesis.cancel();
    if (activeSpeakBtn) {
      const prevLabel = activeSpeakBtn.getAttribute('data-label') || '🔊 Read Aloud';
      activeSpeakBtn.classList.remove('speaking');
      activeSpeakBtn.innerHTML = `🔊 ${prevLabel}`;
    }
    if (activeSpeakBtn === btn) {
      activeSpeakBtn = null;
      return;
    }
  }

  let timerInterval = null;
  let totalWordSpans = 0;

  if (containerEl) {
    totalWordSpans = wrapTextNodesInSpans(containerEl);
  }

  currentUtterance = new SpeechSynthesisUtterance(text);
  currentUtterance.rate = 1.0;
  currentUtterance.pitch = 1.0;

  const bestVoice = getBestVoice();
  if (bestVoice) {
    currentUtterance.voice = bestVoice;
  }

  btn.setAttribute('data-label', labelText);

  let boundaryFired = false;

  const updateHighlight = (activeWordSpan) => {
    if (!containerEl || !activeWordSpan) return;

    containerEl.querySelectorAll('.speech-word.highlight').forEach(s => s.classList.remove('highlight'));
    containerEl.querySelectorAll('.speech-line-highlight').forEach(s => s.classList.remove('speech-line-highlight'));

    activeWordSpan.classList.add('highlight');

    const allWords = Array.from(containerEl.querySelectorAll('.speech-word'));
    const currentIndex = allWords.indexOf(activeWordSpan);

    if (currentIndex !== -1) {
      const startIndex = Math.max(0, currentIndex - 1);
      const endIndex = Math.min(allWords.length, currentIndex + 2);

      for (let i = startIndex; i < endIndex; i++) {
        allWords[i].classList.add('speech-line-highlight');
      }
    }

    activeWordSpan.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };

  currentUtterance.addEventListener('boundary', (event) => {
    if (event.name === 'word' && containerEl) {
      boundaryFired = true;
      const wordSpans = containerEl.querySelectorAll('.speech-word');
      const charIndex = event.charIndex;
      const wordsBefore = text.substring(0, charIndex).trim().split(/\s+/).filter(Boolean).length;
      
      if (wordSpans[wordsBefore]) {
        updateHighlight(wordSpans[wordsBefore]);
      }
    }
  });

  currentUtterance.onstart = () => {
    btn.classList.add('speaking');
    btn.innerHTML = '⏹ Stop';
    activeSpeakBtn = btn;

    setTimeout(() => {
      if (!boundaryFired && containerEl && totalWordSpans > 0) {
        const wordSpans = containerEl.querySelectorAll('.speech-word');
        let currentIdx = 0;
        const intervalMs = 430;

        timerInterval = setInterval(() => {
          if (currentIdx < wordSpans.length) {
            updateHighlight(wordSpans[currentIdx]);
            currentIdx++;
          } else {
            clearInterval(timerInterval);
          }
        }, intervalMs);
      }
    }, 400);
  };

  const cleanup = () => {
    if (timerInterval) clearInterval(timerInterval);
    btn.classList.remove('speaking');
    btn.innerHTML = `🔊 ${labelText}`;
    activeSpeakBtn = null;
    
    // FIXED: Only remove highlights, don't restore HTML
    if (containerEl) {
      containerEl.querySelectorAll('.speech-word.highlight').forEach(s => s.classList.remove('highlight'));
      containerEl.querySelectorAll('.speech-line-highlight').forEach(s => s.classList.remove('speech-line-highlight'));
    }
  };

  currentUtterance.onend = cleanup;
  currentUtterance.onerror = cleanup;

  window.speechSynthesis.speak(currentUtterance);
}
function speakQuestion(q, btn, targetContainer) {
    let text = `Question number ${q.question_number}. ${cleanText(q.question_text)}. `;
    text += "Options are: ";
    for (const [key, val] of Object.entries(q.options)) {
      text += `Option ${key}, ${cleanText(val)}. `;
    }
    speakText(text, btn, 'Read Question', targetContainer);
  }

 function speakExplanation(q, btn, targetContainer) {
    let text = `Explanation. The correct answer is option ${q.answer}. `;
    text += cleanText(q.explanation);
    speakText(text, btn, 'Read Explanation', targetContainer);
}
  function speakAiText(q, content, btn, targetContainer) {
    let text = `AI Deep Dive for Question ${q.question_number}. ${cleanText(content)}`;
    speakText(text, btn, 'Read AI Analysis', targetContainer);
  }

  function formatMarkdown(text) {
    let html = text
      .replace(/^### (.*$)/gim, '<strong style="display:block;margin-top:10px;">$1</strong>')
      .replace(/^## (.*$)/gim, '<strong style="display:block;font-size:1.05em;margin-top:12px;">$1</strong>')
      .replace(/^# (.*$)/gim, '<strong style="display:block;font-size:1.1em;margin-top:12px;">$1</strong>')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/\^\{([^}]+)\}/g, '<sup>$1</sup>')
      .replace(/\^([a-zA-Z0-9])/g, '<sup>$1</sup>')
      .replace(/\_\{([^}]+)\}/g, '<sub>$1</sub>')
      .replace(/\_([a-zA-Z0-9])/g, '<sub>$1</sub>')
      .replace(/\\alpha/g, 'α')
      .replace(/\\beta/g, 'β')
      .replace(/\\gamma/g, 'γ')
      .replace(/\\delta/g, 'δ')
      .replace(/\\theta/g, 'θ')
      .replace(/\\lambda/g, 'λ')
      .replace(/\\mu/g, 'μ')
      .replace(/\\pi/g, 'π')
      .replace(/\\sigma/g, 'σ')
      .replace(/\\tau/g, 'τ')
      .replace(/\\phi/g, 'φ')
      .replace(/\\omega/g, 'ω')
      .replace(/\\Delta/g, 'Δ')
      .replace(/\\Pi/g, 'Π')
      .replace(/\\Sigma/g, 'Σ')
      .replace(/\\Omega/g, 'Ω')
      .replace(/\\infty/g, '∞')
      .replace(/\\sum/g, '∑')
      .replace(/\\int/g, '∫')
      .replace(/\\neq/g, '≠')
      .replace(/\\leq/g, '≤')
      .replace(/\\geq/g, '≥')
      .replace(/\\approx/g, '≈')
      .replace(/\\times/g, '×')
      .replace(/\\div/g, '÷')
      .replace(/\\pm/g, '±')
      .replace(/\\rightarrow/g, '→')
      .replace(/\\leftarrow/g, '←')
      .replace(/\\forall/g, '∀')
      .replace(/\\exists/g, '∃')
      .replace(/\\in/g, '∈')
      .replace(/\\subset/g, '⊂')
      .replace(/\\supset/g, '⊃')
      .replace(/\\frac\{([^}]+)\}\{([^}]+)\}/g, 
        '<span style="display:inline-block;vertical-align:middle;text-align:center;"><span style="display:block;border-bottom:2px solid #333;padding:0 6px;">$1</span><span style="display:block;padding:0 6px;">$2</span></span>')
      .replace(/\\sqrt\{([^}]+)\}/g, 
        '<span style="display:inline-block;font-size:1.2em;">√<span style="border-top:2px solid #333;padding:0 4px;">$1</span></span>')
      .replace(/\n/g, '<br>');
    return html;
  }

  async function generateAIDeepDive(q, containerEl) {
    const apiKey = window.GROQ_API_KEY;

    containerEl.innerHTML = `<em>✨ Connecting to Groq... Generating AI Deep Dive Explanation...</em>`;

    try {
      const prompt = `You are an expert UGC NET Computer Science mentor. Provide a detailed, easy-to-understand breakdown for this exam question:\n\n` +
        `Unit: ${q.unit}\n` +
        `Question: ${q.question_text}\n` +
        `Options:\n${JSON.stringify(q.options, null, 2)}\n` +
        `Correct Answer: ${q.answer}\n\n` +
        `Please structure your explanation as follows:\n` +
        `1. Core Concept Explanation\n` +
        `2. Step-by-Step Derivation/Reasoning\n` +
        `3. Analysis of Why Other Options Are Incorrect\n` +
        `4. Quick UGC NET Exam Tip / Related Formula`;

      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: 'llama-3.3-70b-versatile',
          messages: [
            { role: 'user', content: prompt }
          ],
          temperature: 0.5
        })
      });

      if (!response.ok) {
        const errData = await response.json().catch(() => ({}));
        throw new Error(errData.error?.message || `HTTP ${response.status}`);
      }

      const data = await response.json();
      const aiText = data.choices?.[0]?.message?.content || 'No response generated.';

      containerEl.innerHTML = `<strong>🤖 AI Deep Dive Explanation:</strong>\n\n<div class="ai-content-body">${formatMarkdown(aiText)}</div>` +
        `<div style="margin-top: 10px;">` +
        `<button class="speak-btn" id="speak-ai-btn-${q.question_number}">🔊 Read AI Analysis</button>` +
        `</div>`;

      const speakAiBtn = containerEl.querySelector(`#speak-ai-btn-${q.question_number}`);
      const aiContentBody = containerEl.querySelector(`.ai-content-body`);
      if (speakAiBtn) {
        speakAiBtn.addEventListener('click', () => speakAiText(q, aiText, speakAiBtn, aiContentBody));
      }

    } catch (err) {
      console.error(err);
      containerEl.innerHTML = `<span style="color:red;">Error generating AI explanation: ${err.message || err}. Please verify your API key.</span>`;
    }
  }

  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }

  async function loadAllQuestions() {
    const allQuestionsData = [];
    
    try {
      const manifestResponse = await fetch('data/manifest.json');
      if (!manifestResponse.ok) {
        throw new Error('Could not load manifest.json');
      }
      const manifest = await manifestResponse.json();
      
      for (const fileName of manifest.files) {
        try {
          const response = await fetch(`data/${fileName}`);
          if (response.ok) {
            const data = await response.json();
            
            if (Array.isArray(data)) {
              allQuestionsData.push(...data);
            } else if (data.questions && Array.isArray(data.questions)) {
              allQuestionsData.push(...data.questions);
            }
          }
        } catch (err) {
          console.warn(`⚠️ Error loading ${fileName}:`, err.message);
        }
      }
      return allQuestionsData;
      
    } catch (error) {
      const fallbackFiles = ['2025_june_official.json', '2024_june_cancelled.json'];
      for (const fileName of fallbackFiles) {
        try {
          const response = await fetch(`data/${fileName}`);
          if (response.ok) {
            const data = await response.json();
            if (Array.isArray(data)) {
              allQuestionsData.push(...data);
            }
          }
        } catch (err) {}
      }
      return allQuestionsData;
    }
  }

  loadAllQuestions()
    .then(questions => {
      allQuestions = questions;
      populateFilterOptions(allQuestions);
      renderQuestions(allQuestions);
    })
    .catch(error => {
      document.getElementById('questions-container').innerHTML = 
        `<p style="color:red;">Error loading questions. Make sure you are serving the files via a local web server.</p>`;
      console.error(error);
    });

  function populateFilterOptions(questions) {
    const yearSelect = document.getElementById('year-filter');
    const unitSelect = document.getElementById('unit-filter');

    const years = [...new Set(questions.map(q => q.year).filter(Boolean))];
    const units = [...new Set(questions.map(q => {
        if (q.unit) {
            return q.unit.replace(/\([^)]*\)/g, '').trim();
        }
        return null;
    }).filter(Boolean))];

    years.sort();

    units.sort((a, b) => {
        const numA = parseInt(a.match(/\d+/)?.[0] || 0, 10);
        const numB = parseInt(b.match(/\d+/)?.[0] || 0, 10);
        return numA - numB;
    });

    yearSelect.innerHTML = '<option value="all">All Years</option>';
    unitSelect.innerHTML = '<option value="all">All Units</option>';

    years.forEach(year => {
        const opt = document.createElement('option');
        opt.value = year;
        opt.textContent = year;
        yearSelect.appendChild(opt);
    });

    units.forEach(unit => {
        const opt = document.createElement('option');
        opt.value = unit;
        opt.textContent = unit;
        unitSelect.appendChild(opt);
    });

    yearSelect.addEventListener('change', applyFilters);
    unitSelect.addEventListener('change', applyFilters);
  }

  function applyFilters() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    const selectedYear = document.getElementById('year-filter').value;
    const selectedUnit = document.getElementById('unit-filter').value;

    const filtered = allQuestions.filter(q => {
        const matchYear = (selectedYear === 'all') || (q.year === selectedYear);
        let matchUnit = true;
        if (selectedUnit !== 'all') {
            const qUnit = q.unit ? q.unit.replace(/\([^)]*\)/g, '').trim() : '';
            matchUnit = qUnit === selectedUnit;
        }
        return matchYear && matchUnit;
    });

    renderQuestions(filtered);
  }

  function renderQuestions(questions) {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    if (questions.length === 0) {
      container.innerHTML = '<p>No questions found for the selected filter combination.</p>';
      return;
    }

    questions.forEach((q, index) => {
      const card = document.createElement('div');
      card.className = 'question-card';

      const correctAnswerKey = q.answer.replace(/[^a-zA-Z]/g, '').toLowerCase();

      let optionsHTML = '<div class="options">';
      for (const [key, value] of Object.entries(q.options)) {
        optionsHTML += `
          <div class="option-item" data-key="${key}">
            (${key}) ${value}
          </div>`;
      }
      optionsHTML += '</div>';

      let svgHTML = '';
      if (q.svg && q.svg.trim() !== '') {
        svgHTML = `
          <div class="svg-container">
            ${q.svg}
          </div>
        `;
      }

      card.innerHTML = `
        <button class="speak-btn speak-q-btn" id="speak-q-btn-${index}">🔊 Read Question</button>
        <span class="unit-badge">${q.unit}</span> ${q.year ? `<span class="unit-badge" style="background:#dceefb; color:#0c5460;">${q.year}</span>` : ''}
        <div class="question-title">Q${q.question_number}. ${q.question_text}</div>
        ${svgHTML}
        ${optionsHTML}
        <div class="explanation-box" id="exp-${index}">
          <strong>Explanation:</strong>\n<div class="exp-content">${formatMarkdown(q.explanation)}</div>
          <div class="button-group">
            <button class="speak-btn" id="speak-exp-btn-${index}">🔊 Read Explanation</button>
            <button class="deep-dive-btn" id="deep-dive-btn-${index}">🤖 AI Deep Dive</button>
          </div>
          <div class="deep-dive-box" id="deep-dive-box-${index}"></div>
        </div>
      `;

      container.appendChild(card);

      const optionElements = card.querySelectorAll('.option-item');
      const expBox = card.querySelector(`#exp-${index}`);
      const expContent = card.querySelector(`.exp-content`);
      const deepDiveBox = card.querySelector(`#deep-dive-box-${index}`);
      const titleBox = card.querySelector(`.question-title`);
      
      const speakQBtn = card.querySelector(`#speak-q-btn-${index}`);
      const speakExpBtn = card.querySelector(`#speak-exp-btn-${index}`);
      const deepDiveBtn = card.querySelector(`#deep-dive-btn-${index}`);

      speakQBtn.addEventListener('click', () => speakQuestion(q, speakQBtn, titleBox));
      speakExpBtn.addEventListener('click', () => speakExplanation(q, speakExpBtn, expContent));

      deepDiveBtn.addEventListener('click', () => {
        const isShown = deepDiveBox.classList.contains('show');
        if (isShown) {
          deepDiveBox.classList.remove('show');
          deepDiveBtn.innerHTML = '🤖 AI Deep Dive';
        } else {
          deepDiveBox.classList.add('show');
          deepDiveBtn.innerHTML = '🤖 Hide AI Deep Dive';
          if (!deepDiveBox.dataset.loaded) {
            generateAIDeepDive(q, deepDiveBox);
            deepDiveBox.dataset.loaded = "true";
          }
        }
      });

      optionElements.forEach(optEl => {
        optEl.addEventListener('click', () => {
          optionElements.forEach(el => el.style.pointerEvents = 'none');

          const selectedKey = optEl.getAttribute('data-key');

          if (selectedKey === correctAnswerKey) {
            optEl.classList.add('correct');
            playCorrectSound();
            triggerPopper();
            triggerBalloons();
          } else {
            optEl.classList.add('incorrect');
            card.querySelector(`[data-key="${correctAnswerKey}"]`).classList.add('correct');
          }

          expBox.classList.add('show');
        });
      });
    });
  }
</script>
